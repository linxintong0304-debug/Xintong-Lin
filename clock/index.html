<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIME IS MOVING — Xintong Lin</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #eeeae1;
    color: #171717;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    min-height: 100vh;
}

.poster {
    min-height: 100vh;
    padding: 35px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
}

.top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: bold;
}

.title {
    font-size: clamp(55px, 10vw, 130px);
    font-weight: 900;
    line-height: 0.82;
    letter-spacing: -7px;
    position: relative;
    z-index: 2;
}

.title span {
    color: #e52d25;
}

.middle {
    position: relative;
    margin: 35px 0;
}

.clock {
    font-size: clamp(55px, 16vw, 190px);
    font-weight: 900;
    letter-spacing: -8px;
    white-space: nowrap;
    position: relative;
    z-index: 2;
    transition: transform 0.4s, color 0.4s;
}

.clock span {
    color: #e52d25;
}

.circle {
    width: 220px;
    height: 220px;
    border: 2px solid #e52d25;
    border-radius: 50%;
    position: absolute;
    right: 8%;
    top: -50px;
    animation: rotate 10s linear infinite;
}

.line {
    width: 100%;
    height: 4px;
    background: #171717;
    margin-top: 20px;
}

.moving-text {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 4px;
    white-space: nowrap;
    overflow: hidden;
    animation: move 15s linear infinite;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.5px;
    position: relative;
    z-index: 3;
}

.bottom span {
    color: #e52d25;
}

.decoration {
    position: absolute;
    width: 250px;
    height: 250px;
    background: #e52d25;
    border-radius: 50%;
    left: -150px;
    bottom: -150px;
    animation: pulse 4s ease-in-out infinite alternate;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes move {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

@keyframes pulse {
    from { transform: scale(0.8); }
    to { transform: scale(1.2); }
}

@media (max-width: 600px) {
    .poster {
        padding: 20px;
    }

    .title {
        letter-spacing: -3px;
    }

    .clock {
        letter-spacing: -5px;
    }

    .circle {
        width: 120px;
        height: 120px;
    }

    .top {
        font-size: 9px;
        letter-spacing: 1px;
    }

    .bottom {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="poster">

    <div class="decoration"></div>

    <div class="top">
        <div>DESN 270 / WEB PATH</div>
        <div id="date">DATE / NOW</div>
    </div>

    <div class="title">
        TIME<br>
        IS<br>
        <span>MOVING.</span>
    </div>

    <div class="middle">

        <div class="circle"></div>

        <div class="clock" id="clock">
            00:00:<span>00</span>
        </div>

        <div class="line"></div>

    </div>

    <div class="moving-text">
        EVERY SECOND COUNTS — TIME NEVER STOPS —
        EVERY SECOND COUNTS — TIME NEVER STOPS —
    </div>

    <div class="bottom">
        <div>LIVE DIGITAL CLOCK</div>
        <div>SECONDS: <span id="seconds">00</span></div>
        <div>2026 / NOW</div>
        <div>CREATED BY XINTONG LIN</div>
    </div>

</div>

<script>

function displayTime() {

    let now = new Date();

    let hours = String(now.getHours()).padStart(2, '0');
    let minutes = String(now.getMinutes()).padStart(2, '0');
    let seconds = String(now.getSeconds()).padStart(2, '0');

    // Update clock using jQuery
    $("#clock").html(
        hours + ":" + minutes + ":<span>" + seconds + "</span>"
    );

    // Update seconds
    $("#seconds").text(seconds);

    // Update date
    $("#date").text(now.toDateString());

    // Change clock color
    if (now.getSeconds() % 2 === 0) {
        $("#clock").css("color", "#e52d25");
    } else {
        $("#clock").css("color", "#171717");
    }

    // Animate clock size
    let size = 1 + (now.getSeconds() % 5) * 0.015;

    $("#clock").css(
        "transform",
        "scale(" + size + ")"
    );

}

// Display immediately
displayTime();

// Update every second
setInterval(displayTime, 1000);

</script>

</body>
</html>
