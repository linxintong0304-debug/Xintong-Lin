<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIME IS MOVING</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #eeeae1;
    color: #171717;
    font-family: Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
}

.poster {
    height: 100vh;
    padding: 35px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.title {
    font-size: clamp(40px, 9vw, 110px);
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -7px;
}

.clock {
    font-size: clamp(65px, 17vw, 210px);
    font-weight: 900;
    letter-spacing: -10px;
    white-space: nowrap;
    transition: color 0.5s, transform 0.5s;
    position: relative;
    z-index: 2;
}

.clock span {
    color: #e52d25;
}

.middle {
    position: relative;
}

.circle {
    position: absolute;
    width: 220px;
    height: 220px;
    border: 2px solid #e52d25;
    border-radius: 50%;
    right: 10%;
    top: -30px;
    animation: rotate 8s linear infinite;
}

.line {
    width: 100%;
    height: 3px;
    background: #171717;
    margin-top: 20px;
}

.moving-text {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 5px;
    white-space: nowrap;
    animation: move 12s linear infinite;
}

.bottom {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

#seconds {
    color: #e52d25;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes move {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

@media (max-width: 600px) {
    .poster {
        padding: 20px;
    }

    .title {
        letter-spacing: -3px;
    }

    .clock {
        letter-spacing: -5px;
    }

    .circle {
        width: 120px;
        height: 120px;
    }
}
</style>
</head>

<body>

<div class="poster">

    <div class="top">
        <div>DESN 270 / WEB PATH</div>
        <div id="date"></div>
    </div>

    <div>
        <div class="title">
            TIME<br>
            IS<br>
            MOVING.
        </div>
    </div>

    <div class="middle">
        <div class="circle"></div>

        <div class="clock" id="clock">
            00:00:<span>00</span>
        </div>

        <div class="line"></div>
    </div>

    <div class="moving-text">
        EVERY SECOND COUNTS — TIME NEVER STOPS —
        EVERY SECOND COUNTS — TIME NEVER STOPS —
    </div>

    <div class="bottom">
        <div>LIVE DIGITAL CLOCK</div>
        <div>SECONDS: <span id="seconds">00</span></div>
        <div>2026 / NOW</div>
    </div>

</div>

<script>

function displayTime() {

    let now = new Date();

    let hours = String(now.getHours()).padStart(2, '0');
    let minutes = String(now.getMinutes()).padStart(2, '0');
    let seconds = String(now.getSeconds()).padStart(2, '0');

    // Display the current time using jQuery
    $("#clock").html(
        hours + ":" + minutes + ":<span>" + seconds + "</span>"
    );

    $("#seconds").text(seconds);

    // Display today's date
    $("#date").text(now.toDateString());

    // Change color every second
    if (now.getSeconds() % 2 === 0) {
        $("#clock").css("color", "#e52d25");
    } else {
        $("#clock").css("color", "#171717");
    }

    // Change size based on seconds
    let size = 1 + (now.getSeconds() % 5) * 0.015;

    $("#clock").css("transform", "scale(" + size + ")");

}

// Run immediately
displayTime();

// Update every second
setInterval(displayTime, 1000);

</script>

</body>
</html>
